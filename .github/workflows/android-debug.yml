name: Build Moji Android Test APK

on:
  push:
    branches: [android-app]
    paths:
      - 'android/**'
      - '.github/workflows/android-debug.yml'
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Prepare Moji launcher icon
        run: |
          mkdir -p android/app/src/main/res/mipmap-mdpi \
                   android/app/src/main/res/mipmap-hdpi \
                   android/app/src/main/res/mipmap-xhdpi \
                   android/app/src/main/res/mipmap-xxhdpi \
                   android/app/src/main/res/mipmap-xxxhdpi
          base64 -d android/app/icon-192.jpg.b64 > /tmp/moji-icon.jpg
          cp /tmp/moji-icon.jpg android/app/src/main/res/mipmap-mdpi/ic_launcher.jpg
          cp /tmp/moji-icon.jpg android/app/src/main/res/mipmap-hdpi/ic_launcher.jpg
          cp /tmp/moji-icon.jpg android/app/src/main/res/mipmap-xhdpi/ic_launcher.jpg
          cp /tmp/moji-icon.jpg android/app/src/main/res/mipmap-xxhdpi/ic_launcher.jpg
          cp /tmp/moji-icon.jpg android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.jpg

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Moji-Android-Test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
